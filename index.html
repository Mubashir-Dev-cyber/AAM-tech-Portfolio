<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AAM Technology builds modern, responsive websites and digital solutions for businesses, startups, and organizations." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <title>AAM Technology — Websites & Digital Solutions</title>
    <meta name="theme-color" content="#070b14" />
    <script>
      // Set the theme before first paint so there is no flash of the wrong one
      try {
        var c = localStorage.getItem('aam-theme-choice');
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        // New visitors start in dark; only an explicit "System" pick follows the device
        document.documentElement.dataset.theme = c === 'light' ? 'light' : c === 'system' && light ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
